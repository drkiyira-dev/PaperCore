<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的文档 · PaperCore AI 学术论文分析系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=22">
    <script src="{{ url_for('static', filename='js/i18n.js') }}?v=24" defer></script>
</head>
<body>
<div class="app-shell">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">P</div>
            <span class="logo-text">PaperCore</span>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="/"><span class="nav-icon">⊞</span><span class="nav-text">工作台</span></a>
            <a class="nav-item active" href="/documents"><span class="nav-icon">☰</span><span class="nav-text">我的文档</span></a>
            <a class="nav-item" href="/history"><span class="nav-icon">◷</span><span class="nav-text">分析历史</span></a>
            <a class="nav-item" href="/reports"><span class="nav-icon">⊡</span><span class="nav-text">结构化报告</span></a>
            <a class="nav-item" href="/settings"><span class="nav-icon">⚙</span><span class="nav-text">设置</span></a>
            <a class="nav-item" href="/brand/" target="_blank" style="margin-top:8px;border-top:1px solid var(--color-border);padding-top:14px"><span class="nav-icon" style="color:var(--color-accent)">◆</span><span class="nav-text">产品介绍</span></a><a class="nav-item" href="/about" target="_blank" style="padding-top:6px"><span class="nav-icon" style="color:var(--color-accent)">✦</span><span class="nav-text">关于我们</span></a>
        </nav>
        <div class="sidebar-status">
            <div class="status-dot running"></div>
            <div class="status-info">
                <span class="status-label">本地运行中</span>
                <span class="status-desc">所有数据仅在本地处理</span>
            </div>
        </div>
    </aside>

    <main class="main-area">
        <div class="topbar">
            <div class="result-topbar-left"><span class="topbar-title">我的文档</span></div>
            <div class="status-badges">
                <span class="badge">本地模式</span>
                <span class="badge">数据不上云</span>
                <span class="badge badge-green">隐私保护中</span>
            </div>
        </div>

        <div class="result-content">
            <div class="history-header">
                <div class="history-header-text">
                    <h2 class="section-title">我的文档</h2>
                    <p class="history-subtitle">上传过的论文原件，仅存在本机 · 同名文件只显示最新一份</p>
                </div>
            </div>

            <div id="docList" class="history-list"></div>

            <div id="docEmpty" class="history-empty" style="display:none">
                <div class="history-empty-icon">☰</div>
                <p class="history-empty-text">还没有上传过文档</p>
                <p class="history-empty-hint">去工作台上传一篇论文，文件会留在这里供管理</p>
                <a href="/" class="btn btn-primary">前往工作台</a>
            </div>

            <div id="docError" class="result-error" style="display:none"></div>
        </div>
    </main>
</div>

<script>
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
}

async function loadDocs() {
    const listEl = document.getElementById('docList');
    const emptyEl = document.getElementById('docEmpty');
    const errEl = document.getElementById('docError');
    errEl.style.display = 'none';
    try {
        const res = await fetch('/api/documents');
        const json = await res.json();
        const docs = (json && json.data) || [];
        listEl.innerHTML = '';
        if (docs.length === 0) { emptyEl.style.display = 'block'; return; }
        emptyEl.style.display = 'none';
        docs.forEach(d => listEl.appendChild(buildCard(d)));
    } catch (e) {
        errEl.textContent = '文档加载失败：' + e.message;
        errEl.style.display = 'block';
    }
}

function buildCard(d) {
    const div = document.createElement('div');
    div.className = 'history-card';
    const analyzed = d.analyzed_count > 0
        ? `已分析 ${d.analyzed_count} 次` : '尚未分析';
    div.innerHTML = `
        <div class="history-card-main">
            <div class="history-card-title" title="${esc(d.filename)}">${esc(d.filename)}</div>
            <div class="history-card-meta">
                <span class="hc-time">${esc(d.time_str)}</span>
                <span class="hc-badge">${fmtSize(d.size)}</span>
                <span class="hc-engine">${analyzed}</span>
            </div>
        </div>
        <div class="history-card-actions">
            <a class="btn btn-secondary" href="/api/documents/${encodeURIComponent(d.safe_filename)}/download">下载原件</a>
            <a class="btn btn-primary" href="/?doc=${encodeURIComponent(d.safe_filename)}">重新分析</a>
            <button class="btn btn-link hc-del">删除</button>
        </div>`;
    div.querySelector('.hc-del').addEventListener('click', () => delDoc(d.safe_filename, div));
    return div;
}

async function delDoc(safe, cardEl) {
    if (!confirm('确认删除这份文档原件？此操作不可撤销（不影响已生成的分析历史）。')) return;
    try {
        const res = await fetch('/api/documents/' + encodeURIComponent(safe), { method: 'DELETE' });
        if (!res.ok && res.status !== 404) throw new Error('删除失败');
        cardEl.remove();
        if (document.querySelectorAll('#docList .history-card').length === 0) loadDocs();
    } catch (e) {
        const errEl = document.getElementById('docError');
        errEl.textContent = '删除失败：' + e.message;
        errEl.style.display = 'block';
    }
}

loadDocs();
</script>
</body>
</html>
